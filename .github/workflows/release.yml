name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build:
        description: Which target to build
        required: false
        default: all
        type: choice
        options:
          - all
          - windows
          - android

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.build == 'all' || inputs.build == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: riff-rust-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-android:
    if: github.event_name != 'workflow_dispatch' || inputs.build == 'all' || inputs.build == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android platform, build tools and NDK
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Initialize Android project
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
        run: npx tauri android init --ci

      - name: Patch MainActivity to allow mixed content
        run: |
          MAIN="$(find src-tauri/gen/android -name MainActivity.kt | head -n 1)"
          echo "Patching $MAIN"
          python3 - "$MAIN" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          if 'android.webkit.WebSettings' not in s:
              s = s.replace('import android.os.Bundle\n', 'import android.os.Bundle\nimport android.webkit.WebSettings\nimport android.webkit.WebView\n')
          if 'MIXED_CONTENT_ALWAYS_ALLOW' not in s:
              inject = '  }\n\n  override fun onWebViewCreate(webView: WebView) {\n    super.onWebViewCreate(webView)\n    webView.settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW\n  }'
              s = s.replace('  }\n}', inject + '\n}')
          open(p, 'w').write(s)
          print(s)
          PY

      - name: Build APK (arm64)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
        run: npx tauri android build --apk --target aarch64 --ci

      - name: Sign APK for sideloading
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | head -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | head -n 1)"
          "$ZIPALIGN" -f -p 4 "$APK" aligned.apk
          "$APKSIGNER" sign --ks debug.keystore --ks-pass pass:android \
            --key-pass pass:android --out "$APK" aligned.apk
          cp "$APK" riff-rust.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: riff-rust-android-arm64-apk
          path: |
            riff-rust.apk
          if-no-files-found: error
