[package]
name = "riff-rust"
version = "0.1.11"
description = "Riff Rust - a fast, low-memory desktop music player, rebuilt in Rust"
authors = ["rootscripts", "Riff Rust contributors"]
edition = "2021"
default-run = "riff-rust"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "sync", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking", "stream", "gzip"] }
lofty = "0.22"
sha1 = "0.10"
sha2 = "0.10"
rand = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
strip = true
